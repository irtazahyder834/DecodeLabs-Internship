<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Savoria</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<script>(function(){try{var t=localStorage.getItem('savoria_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>

<div class="auth-page">
  <a href="index.html" class="auth-back">← Back to Savoria</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" style="position:absolute; top:28px; right:28px;">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/logo.svg" alt="Savoria"></div>
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter the email on your account and we'll send you a reset link.</p>

    <div class="auth-alert" id="forgotAlert"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <div class="form-error" data-error-for="email"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send Reset Link</button>
    </form>

    <div class="auth-footer-link">Remembered it? <a href="login.html">Back to log in</a></div>

    <div class="demo-accounts" id="devResetBox" style="display:none;">
      <strong>Dev mode</strong> — no email service is configured, so the reset link is shown here instead of being emailed.<br>
      <a id="devResetLink" href="#"></a>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('forgotAlert');
    const btn = document.getElementById('forgotBtn');
    const devBox = document.getElementById('devResetBox');
    alertBox.className = 'auth-alert';
    devBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const data = await SavoriaAPI.forgotPassword({ email });
      alertBox.className = 'auth-alert success show';
      alertBox.textContent = data.message || 'If an account with that email exists, a reset link has been sent.';

      if (data.dev_reset_token) {
        const link = document.getElementById('devResetLink');
        const url = `reset-password.html?token=${encodeURIComponent(data.dev_reset_token)}`;
        link.href = url;
        link.textContent = url;
        devBox.style.display = 'block';
      }
    } catch (err) {
      alertBox.className = 'auth-alert error show';
      alertBox.textContent = err.message || 'Something went wrong. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
