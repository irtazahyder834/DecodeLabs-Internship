<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Savoria</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<script>(function(){try{var t=localStorage.getItem('savoria_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>

<div class="auth-page">
  <a href="index.html" class="auth-back">← Back to Savoria</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" style="position:absolute; top:28px; right:28px;">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/logo.svg" alt="Savoria"></div>
    <h1>Choose a new password</h1>
    <p class="auth-sub">Must be at least 8 characters, with one uppercase letter and one number.</p>

    <div class="auth-alert" id="resetAlert"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" required>
        <div class="form-error" data-error-for="password"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required>
        <div class="form-error" data-error-for="confirmPassword"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Reset Password</button>
    </form>

    <div class="auth-footer-link"><a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const alertBox = document.getElementById('resetAlert');

  if (!token) {
    alertBox.className = 'auth-alert error show';
    alertBox.textContent = 'This reset link is missing its token. Please request a new one from the forgot password page.';
    document.getElementById('resetForm').querySelector('button').disabled = true;
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
    alertBox.className = 'auth-alert';

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');

    if (password !== confirmPassword) {
      document.querySelector('[data-error-for="confirmPassword"]').textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      await SavoriaAPI.resetPassword({ token, password });
      alertBox.className = 'auth-alert success show';
      alertBox.textContent = 'Password reset! Redirecting to log in...';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      alertBox.className = 'auth-alert error show';
      alertBox.textContent = err.message || 'Could not reset password. The link may have expired.';
      if (err.errors) {
        Object.entries(err.errors).forEach(([field, msg]) => {
          const el = document.querySelector(`[data-error-for="${field}"]`);
          if (el) el.textContent = msg;
        });
      }
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
